syntax = "proto3";

import "MF/V3/Task.proto";
import "MF/V3/Descriptors/ScannerStatus.proto";

package MF.V3.Tasks;

/**
 * Get the desktop engine's scanner connection status (desktop engine only).
 *
 * > Request example:
 *
 * ```json
 * {
 *     "Task":{ "Index":1, "Type":"GetScannerStatus" }
 * }
 * ```
 *
 * > Response example:
 *
 * ```json
 * {
 *     "Task":{
 *         "Index":1,
 *         "Type":"GetScannerStatus",
 *         "Output":{ "connected":true, "host":"192.168.50.115" },
 *         "State":"Completed"
 *     }
 * }
 * ```
 */
message GetScannerStatus
{

// Client request for the `GetScannerStatus` task.
message Request
{
    // A unique identifier generated by the client.
    int32 Index = 1;

    // "GetScannerStatus"
    string Type = 2;
}

// Server response for the `GetScannerStatus` task.
message Response
{
    // The unique identifier generated by the client.
    int32 Index = 1;

    // "GetScannerStatus"
    string Type = 2;

    // The scanner connection status.
        optional MF.V3.Descriptors.ScannerStatus Output = 3;

    // The current state of the task.
    optional TaskState State = 4;

    // A string describing the error if the task has failed.
    optional string Error = 5;
}

}
